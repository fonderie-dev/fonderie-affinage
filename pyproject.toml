[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fonderie-affinage"
dynamic = ["version"]
description = "Training and fine-tuning open models on domain data, packaged as customised local models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "R. Heller" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=2", "safetensors>=0.5"]

[project.optional-dependencies]
train = ["torch>=2.6", "pillow>=11"]
htc = ["segmentation-models-pytorch>=0.5,<0.6"]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
affinage = "fonderie_affinage.cli:main"

[project.urls]
Documentation = "https://fonderie-dev.github.io/fonderie-affinage/"
Repository = "https://github.com/fonderie-dev/fonderie-affinage"

[tool.hatch.version]
path = "src/fonderie_affinage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fonderie_affinage"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
