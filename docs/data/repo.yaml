# Affinage: status line, scope and milestones. Keep in step with the README.
state: "Draft. The run record, hyperspectral data handling, conversion of the HyperSIGMA base encoders to safetensors, three customisation methods and export with a model card work and are tested on synthetic data. No model trained on real data has been produced or released. This site is still an outline; detailed sections stay marked *coming soon* until they are written."
scope:
  - "Configuration-driven training and fine-tuning runs of open-weight models, full and parameter-efficient (for example LoRA), from a base model pinned to a commit hash."
  - "Data preparation with a manifest and checksums, and a recorded split that [Essai](https://fonderie-dev.github.io/fonderie-essai/) can check for train–test overlap."
  - "A [run record](https://fonderie-dev.github.io/website/methode/#the-run-record) written next to every output."
  - "Export of the result as a customised local model: merged `safetensors` weights, an adapter, or a quantised file for a local runtime, each with a model card."
out_of_scope: "Hosted training services; weight inspection and surgery ([Burin](https://fonderie-dev.github.io/fonderie-burin/)); benchmark evaluation ([Essai](https://fonderie-dev.github.io/fonderie-essai/))."
milestones:
  - "Run-record schema and writer, shared in form with Essai."
  - "A fine-tuning run on a tiny model and synthetic data that completes on CPU inside the test suite."
  - "Export with a generated model card."
